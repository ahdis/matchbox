server:
  servlet:
    context-path: /matchboxv3
spring:
  datasource:
    url: 'jdbc:postgresql://matchbox-db:5432/matchbox'
    username: matchbox
    password: matchbox
    driverClassName: org.postgresql.Driver

    # database connection pool size
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
hapi:
  fhir:
    implementationguides:
      # latest released R4 versions on packages2.fhir.org (2026-09-26); the dependencies are installed with them
      iheformatcodefhir:
        name: ihe.formatcode.fhir
        version: 1.6.0
      eprterm:
        name: ch.fhir.ig.ch-epr-term
        version: 2.0.10
      core:
        name: ch.fhir.ig.ch-core
        version: 6.0.0
      emed:
        name: ch.fhir.ig.ch-emed
        version: 6.0.0
      vacd:
        name: ch.fhir.ig.ch-vacd
        version: 6.0.0
      atc:
        name: ch.fhir.ig.ch-atc
        version: 3.3.0
      sdc:
        name: hl7.fhir.uv.sdc
        version: 4.0.0
      chorf:
        name: ch.fhir.ig.ch-orf
        version: 3.0.2
      chradorder:
        name: ch.fhir.ig.ch-rad-order
        version: 2.0.1
      chetoc:
        name: ch.fhir.ig.ch-etoc
        version: 3.0.1
      mhd:
        name: ihe.iti.mhd
        version: 4.2.4
      pixm:
        name: ihe.iti.pixm
        version: 3.1.0
      chepr:
        name: ch.fhir.ig.ch-epr-fhir
        version: 5.0.0
      challergyintolerance:
        name: ch.fhir.ig.ch-allergyintolerance
        version: 3.0.1
