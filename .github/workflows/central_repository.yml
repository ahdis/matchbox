name: Publish to Maven Central Repository

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build-and-publish-jar:
    name: Publish to Maven Central Repository
    runs-on: ubuntu-latest
    env:
      # Read the HAPI FHIR build from GitHub Packages, see the 'github' repository in pom.xml
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_ARGS: --global-settings ${{ github.workspace }}/.github/maven-settings.xml

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Check that HAPI FHIR is a released version
        # matchbox-engine depends on HAPI FHIR, a build that is only available from GitHub Packages (e.g.
        # 8.13.15-pr8189-1) can't be resolved by the users of matchbox-engine from Maven Central
        run: |
          HAPI_VERSION=$(mvn help:evaluate -Dexpression=hapi.fhir.version -q -DforceStdout --batch-mode --no-transfer-progress)
          if ! [[ "$HAPI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::HAPI FHIR $HAPI_VERSION isn't a released version, matchbox-engine can't be published to Maven Central"
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with: # running setup-java again overwrites the settings.xml
          java-version: "21"
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Build with Maven
        run: mvn package --batch-mode --no-transfer-progress --file pom.xml --projects :matchbox,:matchbox-engine -DskipTests -P release

      - name: Publish to Apache Maven Central
        run: mvn deploy -P release --file pom.xml --projects :matchbox,:matchbox-engine -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.NEXUS_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
# The requirements are described in https://central.sonatype.org/publish/requirements/
# The secrets are managed in https://github.com/ahdis/matchbox/settings/secrets/actions
# The GPG key pair shall have been distributed to a public key server.
# The username/password is for the account at https://issues.sonatype.org and must be authorized for this project.
