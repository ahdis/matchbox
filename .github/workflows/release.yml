name: Create a release

# Checks that Trivy finds no HIGH or CRITICAL vulnerability with a fix in the Docker image, then creates the tag and the
# GitHub release for the version in the POM, with the notes of that version from docs/changelog.md, and starts the Docker
# and Maven Central workflows on the new tag.
# A tag created with the GITHUB_TOKEN doesn't trigger the 'push: tags' workflows, so they're dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the 'v' (e.g. 4.1.19, or 5.0.0-rc1 for a release candidate). Must match the version in pom.xml."
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  # In its own job, so that the build and the scan don't run with the write permissions of the release
  scan:
    name: Build the Docker image and scan it with Trivy
    runs-on: ubuntu-latest
    env:
      # Read the HAPI FHIR build from GitHub Packages, see the 'github' repository in pom.xml
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_ARGS: --global-settings ${{ github.workspace }}/.github/maven-settings.xml
    permissions:
      packages: read # HAPI FHIR from GitHub Packages
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build matchbox server jar
        run: mvn --batch-mode --update-snapshots package -DskipTests -P release

      - name: Build Docker image
        run: docker build -t matchbox:scan -f matchbox-server/Dockerfile matchbox-server

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'image'
          image-ref: 'matchbox:scan'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          version: 'v0.76.1'
          cache: false
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1

  release:
    name: Create the release
    needs: scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::The version '$VERSION' isn't of the form X.Y.Z or X.Y.Z-rcN"
            exit 1
          fi
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --batch-mode --no-transfer-progress)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::The version in pom.xml is $POM_VERSION, not $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::The tag v$VERSION already exists"
            exit 1
          fi

      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The section starts with the line 'YYYY/MM/DD Release X.Y.Z' and ends before the next release line, also one
          # of a release that isn't dated yet ('YYYY/MM/xx Release', e.g. a 4.1.x release below 5.0.0-rc1)
          awk -v version="$VERSION" '
            /^[0-9]{4}\/[0-9x]{2}\/[0-9x]{2} Release / {
              if (found) exit
              if ($3 == version && $1 !~ /x/) found = 1
            }
            found { print }
          ' docs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No section 'Release $VERSION' found in docs/changelog.md"
            exit 1
          fi
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2> /dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...v%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$VERSION" >> release-notes.md
          fi
          cat release-notes.md

      - name: Create the tag and the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          if [[ "$VERSION" == *-rc* ]]; then
            # A release candidate is a pre-release, GitHub doesn't show it as the latest release
            PRERELEASE=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release v$VERSION" \
            --notes-file release-notes.md \
            "${PRERELEASE[@]}"

      - name: Start the Docker and Maven Central workflows
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run googleregistry.yml --ref "v$VERSION"
          # matchbox-engine depends on HAPI FHIR: it's only published to Maven Central with a released HAPI FHIR
          # version (X.Y.Z), not with a build that is only available from GitHub Packages (e.g. 8.13.15-pr8189-1)
          HAPI_VERSION=$(mvn help:evaluate -Dexpression=hapi.fhir.version -q -DforceStdout --batch-mode --no-transfer-progress)
          if [[ "$HAPI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            gh workflow run central_repository.yml --ref "v$VERSION"
          else
            echo "::warning::Not published to Maven Central: HAPI FHIR $HAPI_VERSION isn't a released version"
          fi
