name: Create a release

# Creates the tag and the GitHub release for the version in the POM, with the notes of that version from
# docs/changelog.md, then starts the Docker and Maven Central workflows on the new tag.
# A tag created with the GITHUB_TOKEN doesn't trigger the 'push: tags' workflows, so they're dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the 'v' (e.g. 4.1.19). Must match the version in pom.xml."
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version '$VERSION' isn't of the form X.Y.Z"
            exit 1
          fi
          POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --batch-mode --no-transfer-progress)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::The version in pom.xml is $POM_VERSION, not $VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::The tag v$VERSION already exists"
            exit 1
          fi

      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The section starts with the line 'YYYY/MM/DD Release X.Y.Z' and ends before the next release line
          awk -v version="$VERSION" '
            /^[0-9]{4}\/[0-9]{2}\/[0-9]{2} Release / {
              if (found) exit
              if ($3 == version) found = 1
            }
            found { print }
          ' docs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No section 'Release $VERSION' found in docs/changelog.md"
            exit 1
          fi
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2> /dev/null || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...v%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$VERSION" >> release-notes.md
          fi
          cat release-notes.md

      - name: Create the tag and the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Release v$VERSION" \
            --notes-file release-notes.md

      - name: Start the Docker and Maven Central workflows
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run googleregistry.yml --ref "v$VERSION"
          gh workflow run central_repository.yml --ref "v$VERSION"
