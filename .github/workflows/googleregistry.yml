name: Build and publish the Docker image

# Publishes the image to the GitHub container registry (ghcr.io/ahdis/matchbox). Before v5.0.0, the images were
# published to the Google Artifact Registry (europe-west6-docker.pkg.dev/ahdis-ch/ahdis/matchbox), hence the file name
# (release.yml starts this workflow by its file name)

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  IMAGE: ghcr.io/ahdis/matchbox

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: write # upload the SBOM to the GitHub release
      packages: write # push the image to ghcr.io
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - run: mvn --batch-mode --update-snapshots package -DskipTests -P release

      # The SBOM of the server (in the jar, /actuator/sbom/application) as asset of the GitHub release of the tag
      - name: Upload the SBOM to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            SBOM="matchbox-server-${GITHUB_REF_NAME#v}.cdx.json"
            cp matchbox-server/target/classes/META-INF/sbom/application.cdx.json "$SBOM"
            gh release upload "$GITHUB_REF_NAME" "$SBOM" --clobber
          else
            echo "::warning::There is no GitHub release $GITHUB_REF_NAME, the SBOM isn't uploaded"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          platforms: linux/amd64,linux/arm64

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image for arm and amd
      - name: Build
        run: |-
          TAGS=(--tag "$IMAGE:$GITHUB_REF_NAME")
          # Only a release (vX.Y.Z) becomes 'latest', not a pre-release (e.g. v5.1.0-alpha1, v5.1.0-rc1) or a branch
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS+=(--tag "$IMAGE:latest")
          fi
          # --sbom=true: SBOM attestation (SPDX, of the OS packages and the jars) in the image index of each platform
          # The 'source' annotation links the ghcr.io package to the repository (its page, access and visibility)
          docker buildx build \
            "${TAGS[@]}" \
            --sbom=true \
            --annotation "index:org.opencontainers.image.source=https://github.com/ahdis/matchbox" \
            --annotation "index:org.opencontainers.image.description=Matchbox: FHIR validation and mapping" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg GITHUB_REF="$GITHUB_REF" \
            --push \
            --platform=linux/arm64,linux/amd64 \
            -f matchbox-server/Dockerfile \
            matchbox-server
      
      - name: Send a stream message to Zulip
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "matchbox"
          type: "stream"
          topic: "new matchbox version published"
          content: |
              :rocket: ${{ env.IMAGE }}:${{ github.ref_name }} published :rocket:
              
              see also https://github.com/ahdis/matchbox/releases/tag/${{ github.ref_name }}
              
              docker pull ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Send a stream message to Zulip
        uses: zulip/github-actions-zulip/send-message@v2
        if: failure() 
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "ahdis"
          type: "stream"
          topic: "failed publishing matchbox"
          content: |
              failure ${{ env.IMAGE }}:${{ github.ref_name }} 
              
              see https://github.com/ahdis/matchbox/actions/runs/${{ github.run_id }}
