name: Build and Upload to Google Artifact registry

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  PROJECT_ID: ahdis-ch
  GAR_LOCATION: europe-west6
  REPOSITORY: ahdis
  IMAGE: matchbox

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: write # upload the SBOM to the GitHub release
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - run: mvn --batch-mode --update-snapshots package -DskipTests -P release

      # The SBOM of the server (in the jar, /actuator/sbom/application) as asset of the GitHub release of the tag
      - name: Upload the SBOM to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            SBOM="matchbox-server-${GITHUB_REF_NAME#v}.cdx.json"
            cp matchbox-server/target/classes/META-INF/sbom/application.cdx.json "$SBOM"
            gh release upload "$GITHUB_REF_NAME" "$SBOM" --clobber
          else
            echo "::warning::There is no GitHub release $GITHUB_REF_NAME, the SBOM isn't uploaded"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          platforms: linux/amd64,linux/arm64

      # Configure Workload Identity Federation and generate an access token.
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v3
        with:
          token_format: "access_token"
          workload_identity_provider: "projects/1022310475153/locations/global/workloadIdentityPools/github-wif-pool/providers/oidc-github-provider"
          service_account: "github@ahdis-ch.iam.gserviceaccount.com"

      - name: Docker configuration
        run: |-
          echo ${{steps.auth.outputs.access_token}} | docker login -u oauth2accesstoken --password-stdin https://$GAR_LOCATION-docker.pkg.dev

      # Build the Docker image for arm and amd
      - name: Build
        run: |-
          IMAGE_NAME="$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE"
          TAGS=(--tag "$IMAGE_NAME:$GITHUB_REF_NAME")
          # A release candidate (e.g. v5.0.0-rc1) doesn't become the 'latest' image
          if [[ "$GITHUB_REF_NAME" != *-rc* ]]; then
            TAGS+=(--tag "$IMAGE_NAME:latest")
          fi
          # --sbom=true: SBOM attestation (SPDX, of the OS packages and the jars) in the image index of each platform
          docker buildx build \
            "${TAGS[@]}" \
            --sbom=true \
            --build-arg GITHUB_SHA="$GITHUB_SHA" \
            --build-arg GITHUB_REF="$GITHUB_REF" \
            --push \
            --platform=linux/arm64,linux/amd64 \
            -f matchbox-server/Dockerfile \
            matchbox-server
      
      - name: Send a stream message to Zulip
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "matchbox"
          type: "stream"
          topic: "new matchbox version published"
          content: |
              :rocket: ${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.ref_name }} published :rocket:
              
              see also https://github.com/ahdis/matchbox/releases/tag/${{ github.ref_name }}
              
              docker pull ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Send a stream message to Zulip
        uses: zulip/github-actions-zulip/send-message@v2
        if: failure() 
        with:
          api-key: ${{ secrets.ZULIPAPIKEY }}
          email: "ahdis-bot@chat.fhir.org"
          organization-url: "https://chat.fhir.org"
          to: "ahdis"
          type: "stream"
          topic: "failed publishing matchbox"
          content: |
              failure ${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.ref_name }} 
              
              see https://github.com/ahdis/matchbox/actions/runs/${{ github.run_id }}
