dependency-tree: true
debug: true
scan:
  include-dev-deps: true
  scanners:
    - vuln
    - misconfig
  skip-dirs:
    - /matchbox-frontend/node_modules
  # Only the SBOM attestations of the image in its registry: Rekor (sigstore) is searched for each artifact of the
  # image, which took the image scan over its timeout (262 searches of ~8 s, the matchbox jars have none)
  sbom-sources:
    - oci
vulnerability:
  ignore-unfixed: false
pkg:
  types:
    - os
    - library
  ignore-unfixed: false
