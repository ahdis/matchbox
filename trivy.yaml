dependency-tree: true
debug: true
scan:
  include-dev-deps: true
  scanners:
    - vuln
    - misconfig
  skip-dirs:
    - /matchbox-frontend/node_modules
  # No search for SBOM attestations (sbom-sources): the images have none. Rekor (sigstore) is searched for each artifact
  # of the image, which took the image scan over its timeout (262 searches of ~8 s), and the registry (oci) is asked
  # for the image built in the workflow as docker.io/library/matchbox, which Docker Hub refuses (401) and fails the scan
vulnerability:
  ignore-unfixed: false
pkg:
  types:
    - os
    - library
  ignore-unfixed: false
